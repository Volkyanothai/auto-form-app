plugins {
    id 'com.android.application'
}
def webConfig = new Properties()
def webConfigFile = rootProject.file('webapp.properties')
if (webConfigFile.exists()) webConfigFile.withInputStream { webConfig.load(it) }
def webAppUrl = providers.gradleProperty('webAppUrl').getOrElse(webConfig.getProperty('url', ''))
def webUri = webAppUrl ? new URI(webAppUrl) : null
if (webUri == null || webUri.scheme != 'https' || !webUri.host ||
        webUri.userInfo != null || webUri.fragment != null) {
    throw new GradleException('Set a valid HTTPS EZEXAM web URL in android/webapp.properties (url=...)')
}
android {
    namespace 'com.volkyanothai.ezexam'
    compileSdk 35
    defaultConfig {
        applicationId 'com.volkyanothai.ezexam'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '2.0.0'
        buildConfigField 'String', 'WEB_APP_URL', groovy.json.JsonOutput.toJson(webAppUrl)
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
