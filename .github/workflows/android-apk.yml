name: Build Android APK
on:
  push:
    branches: [main, android-web-ui]
    paths:
      - 'android/**'
      - 'scripts/check_android_web.py'
      - 'app.py'
      - 'style.py'
      - 'analysis_validation.py'
      - 'form_media.py'
      - 'submission_flow.py'
      - 'tests/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'scripts/check_android_web.py'
      - 'app.py'
      - 'style.py'
      - 'tests/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Validate web app
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pytest -q
          python -m compileall -q app.py style.py
      - name: Validate hosted app URL
        id: web
        run: python scripts/check_android_web.py
      - name: Build and check Android app
        working-directory: android
        run: gradle "-PwebAppUrl=$EZEXAM_WEB_URL" assembleDebug assembleDebugAndroidTest lintDebug --stacktrace
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test Android web UI, navigation and session support
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          working-directory: android
          script: gradle "-PwebAppUrl=$EZEXAM_WEB_URL" connectedDebugAndroidTest --stacktrace
      - name: Prepare downloadable APK
        if: steps.web.outputs.configured == 'true'
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/EZEXAM.apk
          sha256sum dist/EZEXAM.apk > dist/SHA256SUMS.txt
          cp android/README.md dist/README.md
      - uses: actions/upload-artifact@v4
        if: steps.web.outputs.configured == 'true'
        with:
          name: EZEXAM-Android-APK
          path: dist/
          retention-days: 90
      - name: Publish APK after tests pass
        if: github.event_name != 'pull_request' && steps.web.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-${{ github.run_number }}" dist/EZEXAM.apk dist/SHA256SUMS.txt \
            --target "${{ github.sha }}" --prerelease \
            --title "EZEXAM Android 2.0 — build ${{ github.run_number }}" \
            --notes-file android/RELEASE_NOTES.md
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-test-reports
          path: |
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
