name: Inspect hosted website
on:
  push:
    branches: [android-web-ui]
    paths: ['scripts/inspect_webapp.py', '.github/workflows/web-diagnostics.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/inspect_webapp.py
